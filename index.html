<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="瑞娜工作台">
<meta name="theme-color" content="#F8F6F2">
<meta name="description" content="瑞娜的私人运营工作台">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="167x167" href="apple-touch-icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon-152.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<title>瑞娜的工作台</title>
<style>
:root{
  --bg:#F8F6F2; --card:#FFFFFF; --ink:#1A1A1A; --gray:#8A8A8A;
  --teal:#6BA8A0; --teal-dk:#5E9C94; --teal-lt:#E9F1EE;
  --coral:#D85A30; --coral-lt:#FAECE7;
  --gold-lt:#FAF0DD; --pink-lt:#F7ECEA;
  --shadow:0 2px 8px rgba(94,156,148,.08);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:96px;position:relative}
.page{display:none;padding:20px 20px 0;animation:fadeIn .25s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.hdr{display:flex;align-items:center;justify-content:space-between;margin:14px 0 10px}
.hdr h1{font-size:22px;font-weight:700}
.hdr .sub{font-size:13px;color:var(--gray);margin-top:2px}
.avatar{width:40px;height:40px;border-radius:20px;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600}

.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card h3{font-size:15px;font-weight:700;margin-bottom:8px}
.muted{color:var(--gray);font-size:12px}

.banner{border-radius:16px;padding:14px 16px;margin:0 0 14px;display:flex;align-items:center;gap:12px;color:#fff;cursor:pointer}
.banner.tax{background:var(--coral);box-shadow:0 4px 12px rgba(216,90,48,.3)}
.banner.news{background:var(--teal);box-shadow:0 4px 12px rgba(107,168,160,.25)}
.banner .b-ico{font-size:22px}
.banner .b-tt{font-size:14px;font-weight:700}
.banner .b-sub{font-size:12px;opacity:.9;margin-top:2px}
.dots{display:flex;gap:5px;margin-left:auto}
.dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.45)}
.dots i.on{background:#fff}

.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--card);border-radius:14px;padding:12px 8px;box-shadow:var(--shadow);text-align:center}
.stat .v{font-size:18px;font-weight:700;color:var(--teal-dk)}
.stat .v.coral{color:var(--coral)}
.stat .l{font-size:11px;color:var(--gray);margin-top:3px}

.mini-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.mini-grid .g-item{background:var(--card);border-radius:12px;padding:10px 4px;box-shadow:var(--shadow);text-align:center;cursor:pointer;border:none}
.mini-grid .gi{font-size:20px;margin-bottom:4px}
.mini-grid .gl{font-size:11px;color:#4A4A4A;font-weight:600}

/* ====== 通用左右布局 ====== */
.side-layout{display:flex;gap:10px;align-items:flex-start}
.side-nav{flex:none;width:74px;display:flex;flex-direction:column;gap:8px;padding-top:2px}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border-radius:14px;background:transparent;cursor:pointer;border:none;font-family:inherit;width:100%;transition:background .2s}
.nav-btn.on{background:#fff;box-shadow:var(--shadow)}
.nav-btn .nav-i{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--coral-lt);color:#B57260}
.nav-btn.on .nav-i{background:var(--coral);color:#fff}
.nav-btn .nav-l{font-size:11px;color:#7A7A7A;font-weight:600;line-height:1.25}
.nav-btn.on .nav-l{color:var(--coral)}
.side-main{flex:1;min-width:0}
.side-hint{font-size:12px;color:var(--gray);padding:0 0 8px}
.side-hint .tag{margin-left:6px}

.progress{margin-bottom:14px}
.progress .pt{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.pbar{height:8px;border-radius:4px;background:#ECE6DA;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--teal);border-radius:4px;transition:width .3s}
.task{background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:10px;display:flex;gap:12px;align-items:flex-start}
.task.done{opacity:.55}
.ck{width:22px;height:22px;border-radius:11px;border:2px solid var(--teal);flex:none;margin-top:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
.ck.on{background:var(--teal);border-color:var(--teal)}
.task .tt{font-size:15px;font-weight:600}
.task.done .tt{text-decoration:line-through}
.task .tm{font-size:12px;color:var(--gray);margin-top:3px}
.tag{display:inline-block;padding:2px 10px;border-radius:11px;font-size:11px;background:var(--teal-lt);color:var(--teal-dk)}
.tag.coral{background:var(--coral-lt);color:var(--coral)}
.tag.pink{background:var(--pink-lt);color:#C99890}
.tag.gold{background:var(--gold-lt);color:#C8905A}

.rulepop{background:#FFF7F5;border:1.5px solid #F3C9BA;border-radius:16px;padding:14px 16px;margin:0 0 14px}
.rulepop .rp-h{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--coral);margin-bottom:8px}
.rulepop ul{list-style:none}
.rulepop li{font-size:12.5px;color:#5A4038;padding:3px 0;line-height:1.5}

.topic-card{background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:10px;cursor:pointer;transition:box-shadow .2s}
.topic-card:active{box-shadow:0 1px 4px rgba(94,156,148,.12)}
.topic-card .tp-t{font-size:15.5px;font-weight:700;line-height:1.4;margin-bottom:6px}
.topic-card .tp-how{font-size:12.5px;color:#5A5A5A;line-height:1.6;background:#FAF6EE;border-radius:10px;padding:8px 12px;margin-top:6px}
.tp-hot{font-size:11px;color:var(--gray);font-weight:600}
.tp-full{display:none;margin-top:10px;padding-top:10px;border-top:1px solid #F0EBE0}
.tp-full.show{display:block}
.tp-full h4{font-size:13px;color:var(--coral);margin-bottom:6px;font-weight:700}
.tp-full .tp-script{font-size:12.5px;color:#3A3A3A;line-height:1.7;background:var(--coral-lt);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.tp-full .tp-edit{font-size:12.5px;color:#3A3A3A;line-height:1.7;background:var(--teal-lt);border-radius:10px;padding:10px 12px}
.tp-toggle{font-size:12px;color:var(--teal-dk);margin-top:8px;font-weight:600}

.rule{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.badge{display:inline-block;padding:3px 10px;border-radius:11px;font-size:11px;font-weight:600;color:#fff;margin-bottom:8px}
.badge.hi{background:#D85A30}
.badge.mid{background:#E0A030}
.badge.ok{background:#6BA8A0}
.rule .rr-t{font-size:15px;font-weight:700;margin-bottom:5px}
.rule .rr-d{font-size:12.5px;color:var(--gray);line-height:1.6;margin-bottom:6px}
.rule .rr-how{font-size:12.5px;color:#4A4A4A;line-height:1.6;background:var(--teal-lt);border-radius:10px;padding:8px 12px}
.rule .rr-how b{color:var(--teal-dk)}

.money-card{background:var(--coral);border-radius:20px;padding:20px;color:#fff;box-shadow:0 4px 12px rgba(216,90,48,.3);margin-bottom:14px}
.money-card .ml{font-size:13px;color:var(--coral-lt)}
.money-card .mv{font-size:32px;font-weight:700;margin:6px 0 4px;font-family:"DIN Alternate",-apple-system,sans-serif}
.money-card .mr{display:flex;justify-content:space-between;font-size:12px;color:var(--coral-lt);margin-top:8px;cursor:pointer}
.money-card .mr span{padding:3px 8px;border-radius:8px;background:rgba(255,255,255,.12)}
.money-summary{display:flex;gap:10px;margin-bottom:14px}
.money-summary .ms{flex:1;background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--shadow);text-align:center}
.money-summary .ms .ml{font-size:11px;color:var(--gray)}
.money-summary .ms .mv{font-size:16px;font-weight:700;margin-top:3px}
.money-summary .ms .mv.teal{color:var(--teal-dk)}
.money-summary .ms .mv.coral{color:var(--coral)}
.quick{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.q-item{background:var(--card);border-radius:14px;padding:10px 4px;box-shadow:var(--shadow);text-align:center;cursor:pointer;border:none}
.q-item .qi{font-size:18px;margin-bottom:3px}
.q-item .ql{font-size:11px;color:#4A4A4A}
.q-item.add{background:var(--coral)}
.q-item.add .ql{color:#fff}
.q-item.income{background:var(--teal-lt)}
.q-item.income .ql{color:var(--teal-dk)}
.sec-h{font-size:15px;font-weight:700;margin:4px 0 12px}
.entry{background:var(--card);border-radius:14px;padding:12px 16px;box-shadow:var(--shadow);margin-bottom:10px;display:flex;align-items:center;gap:12px}
.e-ico{width:36px;height:36px;border-radius:12px;background:var(--coral-lt);display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.e-ico.income{background:var(--teal-lt)}
.e-body{flex:1;min-width:0}
.e-t{font-size:14px}
.e-m{font-size:11px;color:var(--gray);margin-top:2px}
.e-amt{font-size:15px;font-weight:600;flex:none}
.e-amt.income{color:var(--teal-dk)}
.e-del{border:none;background:none;color:#C9C9C9;font-size:16px;padding:4px;cursor:pointer}

.word-hero{background:var(--card);border-radius:20px;padding:22px;box-shadow:var(--shadow);margin-bottom:14px;text-align:center}
.word-hero .w{font-size:30px;font-weight:700;color:var(--teal-dk)}
.word-hero .p{font-size:13px;color:var(--gray);margin-top:2px}
.word-hero .ex{font-size:14px;margin-top:12px;line-height:1.6}
.word-hero .ex b{color:var(--teal-dk)}
.word-card{background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:10px}
.word-card .wh{display:flex;align-items:baseline;gap:8px}
.word-card .w{font-size:17px;font-weight:700}
.word-card .p{font-size:12px;color:var(--gray)}
.word-card .row{font-size:12.5px;margin-top:7px;line-height:1.55;color:#4A4A4A}
.word-card .row b{font-weight:600}
.word-mini{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:8px}
.word-mini .wh{display:flex;align-items:baseline;gap:8px}
.word-mini .w{font-size:16px;font-weight:700}
.word-mini .p{font-size:11px;color:var(--gray)}
.word-mini .sc{font-size:12px;color:#5A5A5A;margin-top:5px}

.study-card{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px;cursor:pointer;transition:box-shadow .2s}
.study-card:active{box-shadow:0 1px 4px rgba(94,156,148,.12)}
.study-card .st{font-size:15px;font-weight:700;margin-bottom:5px;line-height:1.45}
.study-card .sd{font-size:12.5px;color:var(--gray);line-height:1.6}
.study-card .sfull{font-size:13px;color:#3A3A3A;line-height:1.7;margin-top:10px;display:none;padding-top:10px;border-top:1px solid #F0EBE0}
.study-card .sfull.show{display:block}
.study-card .stoggle{font-size:12px;color:var(--teal-dk);margin-top:8px;font-weight:600}
.stars{font-size:12px;color:var(--coral);letter-spacing:1px}

.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:50;padding:8px 20px calc(12px + env(safe-area-inset-bottom))}
.tabbar .pill{max-width:440px;margin:0 auto;background:#fff;border-radius:28px;height:56px;display:flex;box-shadow:0 4px 12px rgba(94,156,148,.18)}
.tabbar button{flex:1;border:none;background:none;font-size:12px;color:#9AA0A6;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:inherit}
.tabbar button .ti{font-size:19px}
.tabbar button.on{color:var(--teal-dk);font-weight:700}

.mask{position:fixed;inset:0;background:rgba(26,26,26,.45);z-index:100;display:none;align-items:flex-end;justify-content:center}
.mask.show{display:flex}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));animation:up .25s ease;max-height:85vh;overflow-y:auto}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.sheet h3{font-size:17px;margin-bottom:16px}
.f-row{margin-bottom:14px}
.f-row label{display:block;font-size:13px;color:var(--gray);margin-bottom:6px}
.f-row input,.f-row select{width:100%;border:1.5px solid #E5E0D5;border-radius:12px;padding:11px 12px;font-size:15px;font-family:inherit;background:#FDFCF9;color:var(--ink);-webkit-appearance:none}
.f-row input:focus,.f-row select:focus{outline:none;border-color:var(--teal)}
.btn{width:100%;border:none;background:var(--coral);color:#fff;border-radius:14px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.btn.ghost{background:var(--teal-lt);color:var(--teal-dk)}
.btn.teal{background:var(--teal)}
.empty{text-align:center;color:var(--gray);font-size:13px;padding:26px 0}

.d-mask{position:fixed;inset:0;background:rgba(26,26,26,.5);z-index:200;display:none;align-items:flex-end;justify-content:center}
.d-mask.show{display:flex}
.d-sheet{background:#fff;width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:24px 20px calc(28px + env(safe-area-inset-bottom));animation:up .25s ease;max-height:80vh;overflow-y:auto}
.d-sheet h3{font-size:18px;margin-bottom:12px;line-height:1.4}
.d-sheet .d-body{font-size:14px;line-height:1.75;color:#3A3A3A}
.d-sheet .d-body p{margin-bottom:10px}
.d-sheet .d-close{margin-top:18px}

.fab{position:fixed;right:18px;bottom:92px;z-index:40;width:50px;height:50px;border-radius:25px;background:var(--coral);border:none;color:#fff;font-size:20px;box-shadow:0 4px 12px rgba(216,90,48,.35);cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}
.c-mask{position:fixed;inset:0;background:rgba(26,26,26,.5);z-index:200;display:none;flex-direction:column;justify-content:flex-end}
.c-mask.show{display:flex}
.c-box{background:#F8F6F2;width:100%;max-width:480px;height:75vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .25s ease}
.c-hdr{background:var(--teal);color:#fff;padding:14px 20px;border-radius:22px 22px 0 0;display:flex;align-items:center;gap:10px;flex:none}
.c-hdr .c-t{font-size:16px;font-weight:700}
.c-hdr .c-sub{font-size:11px;opacity:.85}
.c-hdr .c-close{margin-left:auto;background:none;border:none;color:#fff;font-size:22px;cursor:pointer}
.c-msgs{flex:1;overflow-y:auto;padding:16px 16px;-webkit-overflow-scrolling:touch}
.c-msg{margin-bottom:12px;max-width:85%}
.c-msg.bot{margin-right:auto}
.c-msg.me{margin-left:auto;text-align:right}
.c-bubble{display:inline-block;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.6}
.c-msg.bot .c-bubble{background:#fff;color:var(--ink);border-bottom-left-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.c-msg.me .c-bubble{background:var(--teal);color:#fff;border-bottom-right-radius:4px}
.c-quick{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 8px;flex:none}
.c-quick button{border:1.5px solid var(--teal);background:#fff;color:var(--teal-dk);border-radius:16px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap}
.c-input{display:flex;gap:8px;padding:12px 16px calc(16px + env(safe-area-inset-bottom));background:#fff;flex:none;border-top:1px solid #F0EBE0}
.c-input input{flex:1;border:1.5px solid #E5E0D5;border-radius:22px;padding:10px 16px;font-size:14px;font-family:inherit;outline:none;background:#FDFCF9}
.c-input input:focus{border-color:var(--teal)}
.c-input button{border:none;background:var(--coral);color:#fff;border-radius:20px;padding:0 18px;font-size:15px;cursor:pointer;font-family:inherit;font-weight:600}
.bak-row{display:flex;justify-content:center;gap:16px;margin:14px 0 0}
.bak-row button{border:none;background:none;color:var(--gray);font-size:12px;cursor:pointer;font-family:inherit;text-decoration:underline}
</style>
</head>
<body>
<div id="app">

<!-- ============ 首页 ============ -->
<div class="page active" id="pg-home">
  <div class="hdr">
    <div><h1 id="greet">你好，瑞娜</h1><div class="sub" id="today"></div></div>
    <div class="avatar">瑞</div>
  </div>
  <div class="side-layout">
    <div class="side-nav" id="homeNav"></div>
    <div class="side-main" id="homeMain"></div>
  </div>
</div>

<!-- ============ 每日计划 ============ -->
<div class="page" id="pg-plan">
  <div class="hdr"><div><h1>每日计划</h1><div class="sub" id="planSub"></div></div></div>
  <div class="side-layout">
    <div class="side-nav" id="planNav"></div>
    <div class="side-main" id="planMain"></div>
  </div>
</div>

<!-- ============ 选题灵感 ============ -->
<div class="page" id="pg-topic">
  <div class="hdr"><div><h1>选题灵感</h1><div class="sub">今日推荐 · 按平台分类</div></div><div class="tag coral" style="cursor:pointer" onclick="shuffleTopics()">换一批</div></div>
  <div class="side-layout">
    <div class="side-nav" id="topicNav"></div>
    <div class="side-main" id="topicMain"></div>
  </div>
</div>

<!-- ============ 平台规则 ============ -->
<div class="page" id="pg-rule">
  <div class="hdr"><div><h1>平台规则</h1><div class="sub">发布前 1 分钟速查</div></div></div>
  <div class="side-layout">
    <div class="side-nav" id="ruleNav"></div>
    <div class="side-main" id="ruleMain"></div>
  </div>
</div>

<!-- ============ 记账 ============ -->
<div class="page" id="pg-money">
  <div class="hdr"><div><h1>记账</h1><div class="sub" id="moneyMonth"></div></div></div>
  <div class="side-layout">
    <div class="side-nav" id="moneyNav"></div>
    <div class="side-main" id="moneyMain"></div>
  </div>
</div>

<!-- ============ 每日5词 ============ -->
<div class="page" id="pg-word">
  <div class="hdr"><div><h1>每日5词</h1><div class="sub">生活+工作场景 · 记得更牢</div></div></div>
  <div class="side-layout">
    <div class="side-nav" id="wordNav"></div>
    <div class="side-main" id="wordMain"></div>
  </div>
</div>

<!-- ============ 知识学习 ============ -->
<div class="page" id="pg-study">
  <div class="hdr"><div><h1>知识学习</h1><div class="sub">每两周更新 · 点击卡片展开详情</div></div></div>
  <div class="side-layout">
    <div class="side-nav" id="studyNav"></div>
    <div class="side-main" id="studyMain"></div>
  </div>
</div>

</div>

<!-- ============ 底部导航 ============ -->
<div class="tabbar"><div class="pill">
  <button class="on" data-pg="home" onclick="go('home')"><span class="ti">🏠</span>首页</button>
  <button data-pg="plan" onclick="go('plan')"><span class="ti">📋</span>计划</button>
  <button data-pg="topic" onclick="go('topic')"><span class="ti">💡</span>选题</button>
  <button data-pg="money" onclick="go('money')"><span class="ti">💰</span>记账</button>

function nextDeadline(){
  var y=now.getFullYear(),mds=[[0,15],[3,15],[6,15],[9,15]],best=null;
  for(var i=0;i<mds.length;i++){
    var d=new Date(y,mds[i][0],mds[i][1]);
    if(d<now)d=new Date(y+1,mds[i][0],mds[i][1]);
    if(!best||d<best.d)best={d:d,md:mds[i]};
  }
  return best;
}

function saveEntry(){
  var amt=parseFloat($('fAmt').value);

  var cat=$('fCat').value;
  var type=$('fType').value;
  var title=quickCtx?($('fTitle').value||cat.split('·')[1]||cat):($('fTitle').value||cat);
  if(cat==='设备·可抵税'&&!$('fTitle').value)title='设备采购（记得留发票）';
  var es=store.get('wb_entries',[]);
  es.push({id:Date.now(),title:title,cat:cat,amt:amt,type:type,date:now.getFullYear()+'-'+(now.getMonth()<9?'0':'')+(now.getMonth()+1)+'-'+(now.getDate()<10?'0':'')+now.getDate()});

var wordTab='今日';
var wordTabs=[
  {k:'今日',i:'📝',l:'今日'},
  {k:'全部',i:'📚',l:'全部'}
];
function setWordTab(k){wordTab=k;renderWords()}
function renderWords(){
  renderNav('wordNav',wordTabs,wordTab,'setWordTab');
  var doy=Math.floor((now-new Date(now.getFullYear(),0,0))/86400000);
  var start=doy%words.length,picks=[];
  for(var i=0;i<5;i++)picks.push(words[(start+i)%words.length]);
  var h='';
  if(wordTab==='今日'){
    h+='<div class="word-hero"><div class="w">'+picks[0].w+'</div><div class="p">'+picks[0].p+'</div><div class="ex">'+picks[0].ex+'<br><span class="muted">📍 '+picks[0].sc+'</span></div><div class="ex" style="color:#C46A4A">'+picks[0].mis+'</div></div>';
    for(var i=1;i<5;i++){
      var w=picks[i];
      h+='<div class="word-card"><div class="wh"><span class="w">'+w.w+'</span><span class="p">'+w.p+'</span></div><div class="row">📍 <b>'+w.sc+'</b></div><div class="row" style="color:#C46A4A">'+w.mis+'</div></div>';
    }
  }else{
    h+='<div class="side-hint">全部 '+words.length+' 词 · 每天轮换5个</div>';
    for(var i=0;i<words.length;i++){
      var w=words[i];
      h+='<div class="word-mini"><div class="wh"><span class="w">'+w.w+'</span><span class="p">'+w.p+'</span></div><div class="sc">📍 '+w.sc+'</div></div>';
    }
  }
  $('wordMain').innerHTML=h;
}

  var h='';
  for(var i=0;i<chatHistory.length;i++){
    h+='<div class="c-msg '+(chatHistory[i].me?'me':'bot')+'"><div class="c-bubble">'+chatHistory[i].text+'</div></div>';
  }
  $('cMsgs').innerHTML=h;
  $('cMsgs').scrollTop=$('cMsgs').scrollHeight;

  var h='';

  $('cQuick').innerHTML=h;
}
function quickAsk(i){$('cIn').value=quickQs[i];sendChat()}
function sendChat(){
  var q=$('cIn').value.trim();
  if(!q)return;
  chatHistory.push({me:true,text:q});
  $('cIn').value='';renderChat();
  var ql=q.toLowerCase(),best=null,bestScore=0;
  for(var i=0;i<chatKB.length;i++){
    var score=0;
    for(var j=0;j<chatKB[i].keys.length;j++){if(ql.indexOf(chatKB[i].keys[j])>=0)score++}
    if(score>bestScore){bestScore=score;best=chatKB[i]}
  }
  setTimeout(function(){
    var ans;
    if(best&&bestScore>0){ans=best.a}
    else{ans='这个问题我暂时没有现成答案。建议在WorkBuddy对话窗口里问我（就是你现在跟我聊天的这个App），那边的AI带着你的完整记忆，能回答更复杂的问题。你也可以试试换个问法，比如「标签」「报税」「选题」。'}
    chatHistory.push({me:false,text:ans});renderChat();
    if(!best||bestScore===0){
      setTimeout(function(){chatHistory.push({me:false,text:'💡 复杂问题请回WorkBuddy对话窗口提问，那边的AI有你的完整背景记忆。'});renderChat()},800);
    }
  },400);
}

function backupData(){
  var d={};
  for(var i=0;i<localStorage.length;i++){
    var k=localStorage.key(i);
    if(k&&k.indexOf('wb_')===0){try{d[k]=JSON.parse(localStorage.getItem(k))}catch(e){}}
  }
  var blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='瑞娜工作台备份_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
}
